   <g id="text_1">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="112.275" y="90.165377" transform="rotate(-0 112.275 90.165377)">10</text>
   </g>
   <g id="text_2">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(60.043242 117.26396)">peer-reviewed papers,</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(81.624023 128.745464)">2017 to 2026</text>
   </g>
   <g id="text_3">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(49.498594 167.339147)">Protein, cells, bacteria and scar</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(48.247031 177.502538)">all measured, in vitro and in four</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(55.998281 187.665929)">animal and cadaver models.</text>
   </g>
   <g id="text_4">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="293.625" y="90.165377" transform="rotate(-0 293.625 90.165377)">~60%</text>
   </g>
   <g id="text_5">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(241.100391 117.327944)">thinner fibrotic capsule</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(239.052891 128.809448)">around coated implants</text>
   </g>
   <g id="text_6">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(218.842031 167.167304)">One year in mice, on human cochlear</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(227.098828 177.436163)">implant arrays, over platinum and</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(239.101172 187.847616)">silicone alike (Horne 2023).</text>
   </g>
   <g id="text_7">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="474.975" y="90.165377" transform="rotate(-0 474.975 90.165377)">3</text>
   </g>
   <g id="text_8">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'; text-anchor: middle" x="474.975" y="123.068696" transform="rotate(-0 474.975 123.068696)">issued US patents</text>
   </g>
   <g id="text_9">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(407.1825 172.370218)">The photografting method and the</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(402.444141 182.639077)">coated-device system are protected.</text>
   </g>
   <g id="text_10">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="656.325" y="90.165377" transform="rotate(-0 656.325 90.165377)">7</text>
   </g>
   <g id="text_11">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(614.29793 117.202436)">patents granted in</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(625.395938 128.806987)">five countries</text>
   </g>
   <g id="text_12">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(594.043594 167.286413)">United States, Australia, China,</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(582.036328 177.449804)">Japan and Mexico: the largest device</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(639.073125 187.718663)">markets.</text>
   </g>
   <g id="text_13">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="112.275" y="273.117377" transform="rotate(-0 112.275 273.117377)">~50%</text>
   </g>
   <g id="text_14">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(57.714375 294.475208)">less insertion force with</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(43.988906 305.956712)">coated cochlear implants and</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(67.620469 317.438215)">endotracheal tubes</text>
   </g>
   <g id="text_15">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(51.496875 344.908655)">Three studies: human cadaver</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(51.243047 355.072046)">cochleae twice and a synthetic</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(42.226875 365.483499)">cochlea (Bennion 2021, Peel 2024,</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(83.013047 375.894952)">SBIR dataset).</text>
   </g>
   <g id="text_16">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="293.625" y="272.954877" transform="rotate(-0 293.625 272.954877)">1 year</text>
   </g>
   <g id="text_17">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(259.491797 300.21596)">film intact after</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(251.317383 311.697464)">implantation, mice</text>
   </g>
   <g id="text_18">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(228.600703 350.187788)">The covalent graft was still intact</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(227.335781 360.456647)">at one year, and the scar capsule</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(270.612422 370.725507)">stayed thin.</text>
   </g>
   <g id="text_19">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="474.975" y="273.117377" transform="rotate(-0 474.975 273.117377)">6 months</text>
   </g>
   <g id="text_20">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(418.949297 300.218421)">functional human arrays</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(455.127539 311.822971)">in sheep</text>
   </g>
   <g id="text_21">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(412.281563 350.167116)">Works on the real device: lower</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(398.186016 360.473101)">impedance and less inflammation on a</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(442.463906 370.636491)">working implant.</text>
   </g>
   <g id="text_22">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="656.325" y="273.117377" transform="rotate(-0 656.325 273.117377)">~90%</text>
   </g>
   <g id="text_23">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(587.166914 294.475208)">less protein, cell and bacterial</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(606.420469 305.956712)">adhesion and friction,</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(599.996602 317.438215)">published bench studies</text>
   </g>
   <g id="text_24">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(592.792031 350.185679)">A tightly bound water shell turns</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(586.041328 360.454538)">away protein, cells and bacteria, so</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(589.03875 370.723397)">scar and biofilm have no foothold.</text>
   </g>
   <g id="text_25">
    <text style="fill: #1b1f24; font: 700 14px 'Arial'; text-anchor: start" x="21.6" y="31.620937" transform="rotate(-0 21.6 31.620937)">The public record in numbers</text>
   </g>
  </g>
 </g>
