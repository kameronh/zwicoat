   <g id="text_1">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="119.25" y="90.165377" transform="rotate(-0 119.25 90.165377)">182</text>
   </g>
   <g id="text_2">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(58.563281 117.26396)">experiments with a written</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(105.536836 128.745464)">report</text>
   </g>
   <g id="text_3">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(60.725391 172.368108)">Every result traces to a dated</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(77.984297 182.636968)">report in our archive.</text>
   </g>
   <g id="text_4">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="314.55" y="90.165377" transform="rotate(-0 314.55 90.165377)">1,056</text>
   </g>
   <g id="text_5">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(257.932031 117.26396)">adhesion tests on seven</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(290.331914 128.745464)">substrates</text>
   </g>
   <g id="text_6">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(268.77375 167.162382)">Durable: bond strength</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(252.023203 177.431241)">characterized on silicone, PVC,</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(240.759141 187.737226)">PEEK, parylene-C and polyurethane.</text>
   </g>
   <g id="text_7">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="509.85" y="90.165377" transform="rotate(-0 509.85 90.165377)">468</text>
   </g>
   <g id="text_8">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(454.405898 117.26396)">coated cochlear implant</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(473.086875 128.745464)">samples scored</text>
   </g>
   <g id="text_9">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(450.068906 172.368108)">Repeatable: a scored process</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(442.900547 182.531499)">record behind every coated array.</text>
   </g>
   <g id="text_10">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="119.25" y="273.117377" transform="rotate(-0 119.25 273.117377)">136</text>
   </g>
   <g id="text_11">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(43.970742 300.074456)">animals with recorded outcomes</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(75.781641 311.715921)">(mice, rats, sheep)</text>
   </g>
   <g id="text_12">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(60.477891 355.320108)">Four models, from bench to a</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(86.738906 365.483499)">working implant.</text>
   </g>
   <g id="text_13">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="314.55" y="273.117377" transform="rotate(-0 314.55 273.117377)">2,812</text>
   </g>
   <g id="text_14">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'; text-anchor: middle" x="314.55" y="305.956712" transform="rotate(-0 314.55 305.956712)">raw data files archived</text>
   </g>
   <g id="text_15">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(246.933984 355.320108)">Traceable: the raw data sit behind</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(291.043125 365.483499)">every chart.</text>
   </g>
   <g id="text_16">
    <text style="fill: #0e7fc4; font: 700 32px 'Arial'; text-anchor: middle" x="509.85" y="273.117377" transform="rotate(-0 509.85 273.117377)">20</text>
   </g>
   <g id="text_17">
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(443.026523 300.21596)">scientists and students since</text>
    <text style="fill: #1b1f24; font: 10.5px 'Arial'" transform="translate(498.172031 311.697464)">2016</text>
   </g>
   <g id="text_18">
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(451.834453 355.322218)">Ten years of work across two</text>
    <text style="fill: #4a5058; font: 9px 'Arial'" transform="translate(444.650625 365.591077)">university labs and the company.</text>
   </g>
   <g id="text_19">
    <text style="fill: #1b1f24; font: 700 14px 'Arial'; text-anchor: start" x="21.6" y="31.620937" transform="rotate(-0 21.6 31.620937)">And in the archive</text>
   </g>
  </g>
 </g>
