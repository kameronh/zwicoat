# Add these two lines inside the existing <VirtualHost> in
# /etc/apache2/sites-available/zwicoat.conf. If certbot made a separate
# HTTPS file (zwicoat-le-ssl.conf), add them inside that VirtualHost too,
# because that is the one that serves HTTPS traffic.
#
# One-time, if not already enabled:
#   sudo a2enmod proxy proxy_http
#
# ProxyPass is matched before FallbackResource, so /api/contact reaches the
# Flask app and not index.html.
ProxyPass /api/contact http://127.0.0.1:5057/api/contact
ProxyPassReverse /api/contact http://127.0.0.1:5057/api/contact
